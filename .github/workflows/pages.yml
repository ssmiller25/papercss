name: Pages

# The documentation is this framework's primary teaching surface, so it is
# published from the same build the gates verify. This workflow runs
# `make check` - the single gate sequence, so it cannot drift from CI or a
# local run - in the devcontainer, then uploads the `public/` directory that
# produced it and deploys it to GitHub Pages. `public/` is the exact directory
# `make check-docs` (scripts/check-html.mjs) walked and validated, so nothing is
# published from an unverified tree.
#
# The custom domain (papercss.r15cookie.com) and the repository's Pages settings
# are configured by the owner (see AGENTS.md / the release cutover); until then
# the workflow publishes to the default Pages URL.
on:
  push:
    branches: [main, release20]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time, and do not cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `make check` builds and validates the documentation as part of its
      # sequence; the `public/` it leaves behind is what gets published.
      - name: Build and verify in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # Never push the dev container image: there is no imageName and no
          # registry login. The action's `push` input defaults to `filter`, which
          # would attempt a push and fail in the post-job cleanup.
          push: never
          # Reuse the image build layers (apt, Hugo, Node, Playwright Chromium)
          # from the GitHub Actions cache instead of rebuilding them each run.
          cacheFrom: type=gha,scope=devcontainer
          cacheTo: type=gha,scope=devcontainer,mode=max,ignore-error=true
          runCmd: set -o pipefail && make check 2>&1 | tee pages-verify.txt

      # The page set uploaded below is the one `make check-docs` validated. This
      # only asserts that the verified output is present and non-empty, so a
      # build that silently produced nothing cannot be published.
      - name: Confirm the verified output exists
        run: |
          test -f public/index.html || { echo "public/ has no built site"; exit 1; }
          echo "verified output: $(find public -name '*.html' | wc -l) HTML files"

      - name: Publish the verification output
        if: always()
        run: |
          {
            echo "## Documentation build"
            echo
            echo '```'
            cat pages-verify.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
